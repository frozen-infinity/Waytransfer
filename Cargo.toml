[package]
name = "waytransfer"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Experimental low-bandwidth remote display transport"

[features]
default = []
viewer = ["dep:minifb"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lz4_flex = "0.13"
minifb = { version = "0.29", optional = true }

[[bin]]
name = "viewer"
required-features = ["viewer"]

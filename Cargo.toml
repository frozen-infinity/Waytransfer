[package]
name = "waytransfer"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Experimental low-bandwidth remote display transport"

[features]
default = []
viewer = ["dep:minifb"]
compositor = ["dep:smithay", "dep:ctrlc"]
x11 = ["compositor", "smithay/xwayland"]
desktop = ["dep:libc","dep:wayland-client", "dep:wayland-protocols-wlr", "dep:wayland-protocols-misc", "dep:tempfile", "dep:memmap2", "dep:xkbcommon", "dep:ctrlc"]
gpu = ["compositor", "smithay/renderer_gl", "smithay/use_system_lib"]

[dependencies]
lz4_flex = "0.13"
minifb = { version = "0.29", optional = true }

[[bin]]
name = "viewer"
required-features = ["viewer"]

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = { version = "0.31", optional = true }
wayland-protocols-wlr = { version = "0.3", features = ["client"], optional = true }
wayland-protocols-misc = { version = "0.3", features = ["client"], optional = true }
libc = { version = "0.2", optional = true }
memmap2 = { version = "0.9", optional = true }
tempfile = { version = "3", optional = true }
xkbcommon = { version = "0.8", optional = true }
ctrlc = { version = "3", optional = true }
smithay = { version = "0.7", default-features = false, features = ["wayland_frontend", "desktop", "renderer_pixman"], optional = true }

[[bin]]
name = "compositor"
required-features = ["compositor"]

[target.'cfg(target_os = "linux")'.dev-dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
tempfile = "3"

[build-dependencies]
cc = "1"

[[bin]]
name = "desktop"
required-features = ["desktop"]
